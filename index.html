<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f7fb">
<title>GRE 等价词连连看</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#788399;--line:#e3e8f1;--blue:#3778f6;--red:#e34d59;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.app{max-width:760px;margin:auto;padding:16px 12px 40px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:3px 2px 14px}
h1{font-size:24px;margin:0;font-weight:800} .mini{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 5px 18px rgba(30,50,80,.045)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.control{background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
select{width:100%;border:0;background:transparent;color:var(--text);font-size:15px;font-weight:700;outline:none}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;font-size:14px;background:#edf1f7;color:#344058}
button.primary{background:var(--blue);color:white;flex:1} button.warn{color:#a76800;background:#fff3d5}
.status{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.progress{height:6px;background:#eef1f6;border-radius:9px;overflow:hidden;margin-top:8px} .bar{height:100%;width:0;background:var(--blue);transition:.25s}
.game-card{margin-top:12px;padding:10px 7px 12px}
.colheads{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:2px 2px 7px}
.colheads div{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.column{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{position:relative;min-height:58px;padding:8px 5px;border:1.5px solid var(--line);border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.2;font-weight:690;overflow-wrap:anywhere;transition:transform .08s,background .15s,border-color .15s}
.tile:active{transform:scale(.97)}
.tile.selected{background:#dfeaff;border-color:#5c8ef6;box-shadow:0 0 0 2px #dce8ff inset}
.tile.selected:after{content:"✓";position:absolute;right:5px;top:4px;width:17px;height:17px;border-radius:50%;background:#3778f6;color:#fff;font-size:11px;display:grid;place-items:center}
.tile.wrong{background:#ffe8ea!important;border-color:#ef7a84!important;animation:shake .28s}
.tile.done{border-color:transparent;box-shadow:0 0 0 1px rgba(0,0,0,.04) inset}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.message{height:24px;padding:6px 3px 0;font-size:13px;font-weight:700;text-align:center}
.foot{font-size:12px;color:var(--muted);line-height:1.55;margin:12px 4px}
.sheet{margin-top:12px;display:none} .sheet.show{display:block}
.wrong-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:6px 8px;border-radius:9px;background:#fff0f1;color:#9d3a43;font-size:12px}
@media(max-width:390px){.tile{font-size:12px;min-height:56px;padding:7px 3px}.board,.colheads{gap:5px}h1{font-size:22px}}
</style>
</head>

<div class="app">
  <div class="header">
    <div><h1>GRE 等价词连连看</h1><div class="mini">三列独立打乱 · 选中同色 · 正确后成组锁定</div></div>

  <div class="card">
    <div class="controls">

    <div class="actions">

    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="card game-card">
    <div class="colheads"><div>单词</div><div>等价词</div><div>中文</div></div>
    <div class="board">
      <div id="colA" class="column"></div>
      <div id="colB" class="column"></div>
      <div id="colC" class="column"></div>
    </div>
    <div class="message" id="msg"></div>
  </div>

  <div class="card sheet" id="wrongSheet">
    <b>本轮易错词</b><div class="wrong-list" id="wrongList"></div>
  </div>

  <div class="foot">题库按你上传的《真经 GRE 等价词汇总（2026年版）》整理。第二列若原资料给出多个等价词，每轮会随机抽其中一个显示；中文释义保留资料原文。错选过的词会自动进入“错词本”，保存在当前浏览器。</div>
</div>

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function synChoice(s){let xs=s.split(',').map(x=>x.trim()).filter(Boolean);return xs[Math.floor(Math.random()*xs.length)]}
function savedWrong(){try{return JSON.parse(localStorage.getItem('greWrong')||'{}')}catch(e){return {}}}

function chooseRound(){
 let p=shuffle(pool()), n=+document.getElementById('countSel').value, out=[],seenA=new Set(),seenB=new Set(),seenC=new Set();

   let b=synChoice(r.b);
   if(seenA.has(r.a)||seenB.has(b)||seenC.has(r.c)) continue;

   if(out.length===n) break;

}

   done.add(id);correct++;document.getElementById('msg').textContent='✓ 对了';
 }else{
   errors++; for(const x of [sel.A,sel.B,sel.C]){mistakes.add(x.id);saveWrong(x.id);x.el.classList.remove('selected');x.el.classList.add('wrong');setTimeout(()=>x.el.classList.remove('wrong'),360)}
   document.getElementById('msg').textContent='✗ 再想一下';
 }
 sel={A:null,B:null,C:null};updateStatus();updateWrongCount();
 if(correct===round.length)finish();
}
function updateStatus(){
 document.getElementById('score').textContent='正确 '+correct+'/'+round.length;
 document.getElementById('errors').textContent='错误 '+errors+' 次';
 document.getElementById('bar').style.width=(round.length?correct/round.length*100:0)+'%';
}
function finish(){
 document.getElementById('msg').textContent=errors===0?'🎉 全对！可以下一组了':'完成！错过的词已加入错词本';
 if(mistakes.size){
   let box=document.getElementById('wrongList');box.innerHTML='';
   for(const id of mistakes){let r=DATA.find(x=>x.id===id);if(!r)continue;let t=document.createElement('span');t.className='tag';t.textContent=r.a;box.appendChild(t)}
   document.getElementById('wrongSheet').classList.add('show');
 }
}
function reshuffle(){
 if(!round.length)return;
 let old=[...round];render();round=old; // render uses same round, independent shuffles
}
function hint(){
 let remaining=round.filter(r=>!done.has(r.id));if(!remaining.length)return;
 let r=remaining[Math.floor(Math.random()*remaining.length)];
 let els=[...document.querySelectorAll('.tile[data-id="'+r.id+'"]')];
 els.forEach(x=>{x.style.background='#FFF3C7';x.style.borderColor='#E8B84C';setTimeout(()=>{if(!x.classList.contains('done')){x.style.background='';x.style.borderColor=''}},1200)});
}
document.getElementById('newBtn').onclick=newRound;
document.getElementById('reshuffleBtn').onclick=()=>{if(round.length)render()};
document.getElementById('hintBtn').onclick=hint;
document.getElementById('daySel').onchange=newRound;
document.getElementById('countSel').onchange=newRound;
updateWrongCount();newRound();
</script>
</body>
</html>
