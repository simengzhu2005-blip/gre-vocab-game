/* 自由连线抽题策略
   - 约 75% 优先抽“自由连线里从未出现过”的新词
   - 约 25% 用于复习旧词
   - 错过的词在复习池里优先
   - 最近 2 轮出现过的词进入冷却，尽量不连续重复
*/
function kSeen(){return 'greFreeSeen_d'+d()}
function kWrong(){return 'greFreeWrong_d'+d()}
function kRecent(){return 'greFreeRecent_d'+d()}

function getObj(k){
  try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}
  catch{return {}}
}
function saveObj(k,o){localStorage.setItem(k,JSON.stringify(o))}
function getRecent(){
  try{
    let x=JSON.parse(localStorage.getItem(kRecent())||'[]');
    return Array.isArray(x)?x:[]
  }catch{return []}
}
function saveRecent(x){localStorage.setItem(kRecent(),JSON.stringify(x))}

function weightedReview(cands, wrongMap, seenMap){
  // 错题权重最高；出现次数越少，复习优先级也略高。
  return sh(cands).sort((a,b)=>{
    let wa=(wrongMap[a.cid]||0)*100 - (seenMap[a.cid]||0);
    let wb=(wrongMap[b.cid]||0)*100 - (seenMap[b.cid]||0);
    return wb-wa
  })
}

function freeTestRound(){
  let P=p(), n=Math.min(+count.value,P.length);
  let seen=getObj(kSeen()), wrong=getObj(kWrong()), recent=getRecent();
  let cooldown=new Set(recent.flat());
  let unseen=P.filter(x=>!seen[x.cid]);
  let old=P.filter(x=>seen[x.cid]);

  // 8组时通常 6新+2旧；6组时通常 5新+1旧。
  let newTarget=Math.min(unseen.length, Math.ceil(n*0.75));
  let reviewTarget=n-newTarget;

  // 优先从不在冷却期的新词里抽。
  let newFresh=sh(unseen.filter(x=>!cooldown.has(x.cid)));
  let newCool=sh(unseen.filter(x=>cooldown.has(x.cid)));
  let picked=[...newFresh.slice(0,newTarget)];
  if(picked.length<newTarget){
    picked.push(...newCool.slice(0,newTarget-picked.length))
  }

  let chosen=new Set(picked.map(x=>x.cid));
  let reviewFresh=old.filter(x=>!cooldown.has(x.cid)&&!chosen.has(x.cid));
  let reviewCool=old.filter(x=>cooldown.has(x.cid)&&!chosen.has(x.cid));
  let reviewOrder=[
    ...weightedReview(reviewFresh,wrong,seen),
    ...weightedReview(reviewCool,wrong,seen)
  ];
  picked.push(...reviewOrder.slice(0,reviewTarget));

  // 如果旧词不够，就继续用剩余新词补齐；如果新词也不够，再从其余词补。
  if(picked.length<n){
    chosen=new Set(picked.map(x=>x.cid));
    let fill=[
      ...sh(unseen.filter(x=>!chosen.has(x.cid)&&!cooldown.has(x.cid))),
      ...sh(unseen.filter(x=>!chosen.has(x.cid)&&cooldown.has(x.cid))),
      ...weightedReview(P.filter(x=>!chosen.has(x.cid)&&!cooldown.has(x.cid)),wrong,seen),
      ...weightedReview(P.filter(x=>!chosen.has(x.cid)&&cooldown.has(x.cid)),wrong,seen)
    ];
    for(const x of fill){
      if(!chosen.has(x.cid)){
        picked.push(x);chosen.add(x.cid);
        if(picked.length>=n)break
      }
    }
  }

  // 记录本轮出现次数，并维护最近2轮冷却窗口。
  for(const x of picked) seen[x.cid]=(seen[x.cid]||0)+1;
  saveObj(kSeen(),seen);
  recent.push(picked.map(x=>x.cid));
  while(recent.length>2) recent.shift();
  saveRecent(recent);

  let newCount=picked.filter(x=>(seen[x.cid]||0)===1).length;
  return {items:picked,newCount,reviewCount:picked.length-newCount}
}

function markFreeWrong(ids){
  let w=getObj(kWrong());
  for(const id of new Set(ids)) w[id]=(w[id]||0)+1;
  saveObj(kWrong(),w)
}

}

function startMilestone(){
  resetMilestoneSession();
  let m=milestoneTarget();
  if(!m){showNotice('先在纯背诵模式学习到 25%，再做阶段检测。');return false}
  currentM=m;
  let cfg=MS[m],L=getset(kL()),eligible=sh(p().filter(x=>L.has(x.cid)));
  msTotalRounds=cfg.rounds;msPageSize=cfg.size;
  let need=cfg.rounds*cfg.size;
  msQueue=eligible.slice(0,Math.min(need,eligible.length));
  if(!msQueue.length){showNotice('当前没有可用于检测的已学习词组。');return false}

function nextMilestoneRound(){
  if(!currentM)return;
  if(msRoundIndex>=msTotalRounds){finishMilestone();return}
  let st=msRoundIndex*msPageSize,en=Math.min(st+msPageSize,msQueue.length);
  round=msQueue.slice(st,en);
  msRoundIndex++;
  msWaitingNext=false;
  renderTest();
  setSession(currentM+'% 阶段检测 · 第 '+msRoundIndex+'/'+msTotalRounds+' 轮 · 本轮 '+round.length+' 组');
  showNotice('本次阶段检测共 '+msQueue.length+' 组，分 '+msTotalRounds+' 页完成；各页之间不会重复。');
  newBtn.textContent='当前检测 '+msRoundIndex+'/'+msTotalRounds;
}
function finishMilestone(){
  let T=getset(kT());T.add(currentM);saveset(kT(),T);progress();
  let attempts=msSessionCorrect+msSessionErrors;
  let accuracy=attempts?Math.round(msSessionCorrect/attempts*100):100;
  msg.textContent='🎉 '+currentM+'% 阶段检测完成';
  setSession('检测完成 · '+msSessionCorrect+' 组匹配成功 · 错误尝试 '+msSessionErrors+' 次 · 尝试正确率约 '+accuracy+'%');
  showNotice('阶段检测已记录完成。你可以继续背诵，或重新进入阶段检测复习这个节点。');
  newBtn.textContent='重新检测';
  msWaitingNext=false
}
function newGroup(){
  hideNotice();
  if(mode==='study'){
    resetMilestoneSession();newBtn.textContent='开始新一组';
    round=studyRound();
    if(!round.length){showNotice('这个 Day 已经全部背完，可进行 100% 阶段检测。');renderStudy();return}
    let L=getset(kL());round.forEach(r=>L.add(r.cid));saveset(kL(),L);
    renderStudy();
    let pc=progress(),T=getset(kT()),m=[25,50,75,100].find(x=>pc>=x&&!T.has(x));
    if(m)showNotice('已达到 '+m+'% 学习进度，阶段检测已解锁。')
  }else if(mode==='test'){
    resetMilestoneSession();newBtn.textContent='开始新一组';
    let result=freeTestRound();
    round=result.items;renderTest();
    showNotice('本轮：'+result.newCount+' 组新词 + '+result.reviewCount+' 组复习；最近 2 轮出现过的词会优先避开，错词会优先进入复习位。')
  }else{
    if(currentM && msWaitingNext){nextMilestoneRound();return}
    if(currentM && msRoundIndex>=msTotalRounds){startMilestone();return}
    startMilestone()
  }
}
function pick(el,col,id){
  if(done.has(id))return;
  if(sel[col]&&sel[col].el===el){el.classList.remove('selected');sel[col]=null;return}
  document.querySelectorAll('.tile[data-col="'+col+'"]').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');sel[col]={id,el};
  if(sel.A&&sel.B&&sel.C)setTimeout(check,100)
}
function check(){
  let ids=[sel.A.id,sel.B.id,sel.C.id],ok=ids[0]===ids[1]&&ids[1]===ids[2];
  if(ok){
    let id=ids[0],[bg,fg]=pal[correct%pal.length];
    document.querySelectorAll('.tile[data-id="'+id+'"]').forEach(x=>{x.classList.remove('selected');x.classList.add('done');x.style.background=bg;x.style.color=fg});
    done.add(id);correct++;if(mode==='milestone')msSessionCorrect++;msg.textContent='✓ 对了'
  }else{
    errors++;
    if(mode==='milestone')msSessionErrors++;
    if(mode==='test')markFreeWrong(ids);
    [sel.A,sel.B,sel.C].forEach(x=>{x.el.classList.remove('selected');x.el.classList.add('wrong');setTimeout(()=>x.el.classList.remove('wrong'),300)});
    msg.textContent='✗ 再想一下'
  }
  sel={A:null,B:null,C:null};score();
  if(correct===round.length&&round.length){
    if(mode==='milestone'&&currentM){
      if(msRoundIndex<msTotalRounds){
        msWaitingNext=true;
        msg.textContent='✓ 第 '+msRoundIndex+'/'+msTotalRounds+' 轮完成';
        newBtn.textContent='下一轮检测（'+(msRoundIndex+1)+'/'+msTotalRounds+'）';
        setSession(currentM+'% 阶段检测 · 已完成 '+msRoundIndex+'/'+msTotalRounds+' 轮 · 累计错误 '+msSessionErrors+' 次')
      }else finishMilestone()
    }else msg.textContent='🎉 本轮完成'
  }
}
function score(){
  if(mode==='milestone'&&currentM){
    scoreStat.textContent='本页 正确 '+correct+'/'+round.length+' · 错误 '+errors
  }else{
    scoreStat.textContent='本轮 正确 '+correct+'/'+round.length+' · 错误 '+errors
  }
}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;resetMilestoneSession();document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('active',x===b));newGroup()});newBtn.onclick=newGroup;day.onchange=()=>{resetMilestoneSession();progress();newGroup()};count.onchange=()=>{if(mode!=='milestone')newGroup()};resetBtn.onclick=()=>{if(confirm('确定重置本 Day 的学习进度和阶段检测记录吗？')){localStorage.removeItem(kL());localStorage.removeItem(kT());resetMilestoneSession();progress();newGroup()}};progress();newGroup();
</script></body></html>
